# Alternatif deploy sekali klik: Dokploy → Create Service → Compose → tempel file ini.
# Semua nilai ${...} diisi di tab Environment Dokploy, JANGAN di-commit.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tms:${DB_PASSWORD}@db:5432/tms
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      APP_URL: ${BETTER_AUTH_URL}
      UPLOAD_DIR: /app/uploads
      COMPANY_NAME: ${COMPANY_NAME}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS}
      COMPANY_NPWP: ${COMPANY_NPWP:-}
      COMPANY_BANK: ${COMPANY_BANK:-}
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uploads:
  pgdata:
